name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test HomeEyeCore
        run: swift test --package-path HomeEyeCore

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test HomeEyeCore (compiles Darwin branches)
        run: swift test --package-path HomeEyeCore
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -project HomeEye.xcodeproj -scheme HomeEye -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HomeEye.app Payload/
          zip -qry HomeEye.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HomeEye-ipa
          path: HomeEye.ipa
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [core-linux, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HomeEye-ipa
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" HomeEye.ipa --clobber
          else
            gh release create "$GITHUB_REF_NAME" HomeEye.ipa --generate-notes
          fi
