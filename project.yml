name: HomeEye
options:
  bundleIdPrefix: app.homeeye
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HomeEyeCore:
    path: HomeEyeCore
targets:
  HomeEye:
    type: application
    platform: iOS
    sources: [HomeEye]
    dependencies:
      - package: HomeEyeCore
        product: HomeEyeCore
    scheme: {}
    info:
      path: HomeEye/Info.plist
      properties:
        CFBundleDisplayName: HomeEye
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "HomeEye connects directly to cameras on your Wi-Fi to show live video and control pan/tilt. It never connects anywhere else."
        NSPhotoLibraryAddUsageDescription: "HomeEye saves the snapshots you take to your photo library."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.homeeye
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
